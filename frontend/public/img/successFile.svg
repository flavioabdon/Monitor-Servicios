<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="fileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="50" cy="50" r="45" fill="url(#backgroundGradient)" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" opacity="0.3"/>
  
  <!-- Documento/Archivo -->
  <rect x="25" y="20" width="35" height="45" rx="3" ry="3" fill="url(#fileGradient)" stroke="#d1d5db" stroke-width="1.5"/>
  
  <!-- Esquina doblada del documento -->
  <polygon points="55,20 55,30 65,30" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
  <line x1="55" y1="20" x2="65" y2="30" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Líneas de texto en el documento -->
  <rect x="30" y="35" width="20" height="2" rx="1" fill="#9ca3af"/>
  <rect x="30" y="40" width="25" height="2" rx="1" fill="#9ca3af"/>
  <rect x="30" y="45" width="15" height="2" rx="1" fill="#9ca3af"/>
  
  <!-- Flecha de subida -->
  <g transform="translate(35, 25)">
    <line x1="10" y1="15" x2="10" y2="5" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <polyline points="6,9 10,5 14,9" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Marca de verificación (check) -->
  <circle cx="65" cy="65" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <polyline points="60,65 63,68 70,61" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Partículas de éxito (opcional) -->
  <circle cx="25" cy="35" r="1.5" fill="#10b981" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="40" r="1" fill="#34d399" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="75" r="1.2" fill="#6ee7b7" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>