services:
  # ─────────────────────────────────────────────────────────────
  # Base de Datos PostgreSQL
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: segip-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: segip
      POSTGRES_PASSWORD: segip_password
      POSTGRES_DB: segip_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segip -d segip_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Backend API + Probe Scheduler + Notifiers (Node.js)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: segip-monitor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://segip:segip_password@postgres:5432/segip_monitor"
      JWT_SECRET: "segip_secure_jwt_secret_key_2026"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Admin1234!"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      FRONTEND_URL: "http://localhost:3000"
      # Conecta directamente al Ollama instalado en tu máquina local
      OLLAMA_HOST: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3:latest"
    command: >
      sh -c "npx prisma db push && npm run db:seed && npm start"

  # ─────────────────────────────────────────────────────────────
  # Frontend Dashboard & Modo TV NOC (Next.js)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: segip-monitor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:3001"
    depends_on:
      - backend

volumes:
  pgdata:
